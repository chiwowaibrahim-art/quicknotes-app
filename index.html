<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A simple note-taking application.">
    <title>QuickNotes</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <h1>QuickNotes</h1>
        <p>Capture your thoughts. Keep your day organised.</p>
    </header>

    <!-- Main content -->
    <main class="main-content">

        <!-- Add a note -->
        <section class="card" aria-labelledby="add-heading">
            <h2 id="add-heading">Add a note</h2>

            <form id="note-form" class="note-form" novalidate>

                <div class="form-field note-field">
                    <label for="note-input">Your note</label>
                    <input
                        type="text"
                        id="note-input"
                        placeholder="What would you like to remember?"
                        autocomplete="off"
                    >
                </div>

                <div class="form-field category-field">
                    <label for="category-select">Category</label>

                    <select id="category-select">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                    </select>
                </div>

                <button type="submit" class="button">
                    Add Note
                </button>

            </form>

            <!-- Validation error -->
            <p
                id="error-message"
                class="error-message"
                role="alert"
                aria-live="polite"
            ></p>
        </section>

        <!-- Display notes -->
        <section class="card" aria-labelledby="notes-heading">

            <div class="notes-heading">
                <h2 id="notes-heading">Your notes</h2>

                <button
                    type="button"
                    id="clear-all-btn"
                    class="button button-danger"
                >
                    Clear all
                </button>
            </div>

            <!-- Search -->
            <label for="search-input">Search notes</label>

            <input
                type="search"
                id="search-input"
                class="search-input"
                placeholder="Search by note text..."
                autocomplete="off"
            >

            <!-- Note count -->
            <p id="note-count" class="note-count">
                You have no notes yet.
            </p>

            <ul id="notes-list" class="notes-list" aria-live="polite"></ul>

        </section>

    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <p>&copy; 2026 QuickNotes. Keep your ideas close and Organized. Built by Ibrahim Chiwowa.</p>
    </footer>

</body>
</html>
